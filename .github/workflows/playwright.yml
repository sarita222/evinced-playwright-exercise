# Runs all tests, including Evinced accessibility scans, on every push / pull request.
# Credentials come from GitHub Secrets - never from files in the repository.
name: Playwright + Evinced tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      EVINCED_SERVICE_ID: ${{ secrets.EVINCED_SERVICE_ID }}
      EVINCED_API_KEY: ${{ secrets.EVINCED_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Connect npm to the Evinced JFrog registry
      run: |
        echo "@evinced:registry=https://evinced.jfrog.io/artifactory/api/npm/restricted-npm/" > .npmrc
        echo "//evinced.jfrog.io/artifactory/api/npm/restricted-npm/:_authToken=${{ secrets.JFROG_TOKEN }}" >> .npmrc
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Create the Evinced reports folder
      run: mkdir -p evinced-reports
    - name: Run Playwright tests
      run: npx playwright test
    - name: Save the reports
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-reports
        path: |
          playwright-report/
          evinced-reports/
        retention-days: 30